#version: '3.8'
# The version field is now obsolete in newer Docker Compose versions (v2+)
# so I'm just removing it to clean things up - I'm getting old.

services:
  landing:
    build:
      context: .
      dockerfile: docker/development/Dockerfile
      target: dev
    container_name: anbu-landing
    ports:
      - '3000:3000'
    volumes:
      # Mount source code for hot reload (cross-platform compatible)
      - ./apps/landing:/app/apps/landing
      - ./packages:/app/packages
      # Exclude node_modules to use container's version
      - /app/node_modules
      - /app/apps/landing/node_modules
      # Mount pnpm store for faster installs
      - pnpm-store:/root/.local/share/pnpm/store
    environment:
      - NODE_ENV=development
      # File watching settings (automatically adjusted per platform)
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-true}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-true}
      # Polling interval for better performance
      - CHOKIDAR_INTERVAL=1000
      - WATCHPACK_POLL=1000
    command: pnpm dev --filter=landing
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pnpm-store:
    driver: local

networks:
  default:
    name: anbu-network